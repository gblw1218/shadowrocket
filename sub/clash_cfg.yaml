port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - 119.29.29.29
    - quic://223.5.5.5
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  my-auto-nodes:
    type: http
    url: "https://raw.githubusercontent.com/gblw1218/shadowrocket/refs/heads/main/sub/sub_ok_clash.yaml"
    interval: 86400
    path: ./providers/my-auto-nodes.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

rule-providers:
  adblock:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./rules/adblock.yaml
    interval: 86400

proxy-groups:
  - name: 自动选优
    type: url-test
    use:
      - my-auto-nodes
    tolerance: 100
    interval: 600
    filter: "(?i)香港|日本|新加坡|美国|韩国|英国|台湾|加拿大|澳大利亚|德国|法国|印度|HK|JP|SG|US|KR|UK|TW|CA|AU|DE|FR|IN"

  - name: Gemini服务
    type: url-test
    use:
      - my-auto-nodes
    tolerance: 100
    interval: 600
    filter: "(?i)美国|日本|新加坡|韩国|英国|台湾|加拿大|澳大利亚|德国|法国|印度|US|JP|SG|KR|UK|TW|CA|AU|DE|FR|IN"

  - name: 节点选择
    type: select
    proxies:
      - 自动选优
      - Gemini服务
      - DIRECT

rules:
  - RULE-SET,adblock,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择