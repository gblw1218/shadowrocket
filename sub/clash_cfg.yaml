    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 3. 引入去广告等外部规则文件
rule-providers:
  # 去广告规则
  adblock:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./rules/adblock.yaml
    interval: 86400

# 4. 策略组
proxy-groups:
  - name: 自动选优
    type: url-test
    use:
      - my-auto-nodes
    tolerance: 100
    interval: 600
    filter: "(?i)香港|日本|新加坡|美国|HK|JP|SG|US"

  - name: 节点选择
    type: select
    proxies:
      - 自动选优
      - DIRECT

# 5. 分流规则（增加去广告拦截）
rules:
  # 优先拦截广告和隐私追踪域名
  - RULE-SET,adblock,REJECT
  # 国内流量直连
  - GEOIP,CN,DIRECT
  # 其余走节点选择
  - MATCH,节点选择"
    path: ./rules/adblock.yaml
    interval: 86400

