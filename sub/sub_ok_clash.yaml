allow-lan: false
dns:
    enable: true
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fallback:
        - https://dns.cloudflare.com/dns-query
        - https://8.8.8.8/dns-query
    fallback-filter:
        geoip: true
        geoip-code: CN
    ipv6: false
    listen: 0.0.0.0:53
    nameserver:
        - https://dns.alidns.com/dns-query
        - 119.29.29.29
        - quic://223.5.5.5
ipv6: false
log-level: info
mode: rule
port: 7890
proxies: []
proxy-groups:
    - filter: (?i)香港|日本|新加坡|美国|韩国|英国|台湾|加拿大|澳大利亚|德国|法国|印度|HK|JP|SG|US|KR|UK|TW|CA|AU|DE|FR|IN
      interval: 600
      name: 自动选优
      proxies: []
      tolerance: 100
      type: url-test
      url: http://www.gstatic.com/generate_204
    - filter: (?i)美国|日本|新加坡|韩国|英国|台湾|加拿大|澳大利亚|德国|法国|印度|US|JP|SG|KR|UK|TW|CA|AU|DE|FR|IN
      interval: 600
      name: Gemini服务
      proxies: []
      tolerance: 100
      type: url-test
      url: http://www.gstatic.com/generate_204
    - name: 节点选择
      proxies:
        - 自动选优
        - Gemini服务
        - DIRECT
      type: select
rule-providers:
    adblock:
        behavior: domain
        interval: 86400
        path: ./rules/adblock.yaml
        type: http
        url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
rules:
    - RULE-SET,adblock,REJECT
    - GEOIP,CN,DIRECT
    - MATCH,节点选择
socks-port: 7891
