[Script]
# 高德地图 API 清洗
Amap_Ads = type=http-response, pattern=^https?:\/\/.*\.amap\.com\/ws\/(aos|v\d|shield)\/, script-path=https://raw.githubusercontent.com/gblw1218/shadowrocket/refs/heads/main/script/ads_clean.jss, requires-body=true, max-size=524288

# 酷狗 & 网易云开屏 API 清洗
Music_Ads = type=http-response, pattern=^https?:\/\/(.*\.kugou\.com|interface\.music\.163\.com)\/.*(ads|ad|splash|config), script-path=https://raw.githubusercontent.com/gblw1218/shadowrocket/refs/heads/main/script/ads_clean.js, requires-body=true, max-size=524288

# 微信小程序/公众号广告 API 清洗
WeChat_Ads = type=http-response, pattern=^https?:\/\/mp\.weixin\.qq\.com\/(mp\/advertisement|wxagame\/getad), script-path=https://raw.githubusercontent.com/gblw1218/shadowrocket/refs/heads/main/script/ads_clean.js, requires-body=true, max-size=524288
# 菜鸟广告 API 响应体清洗
Cainiao_Ads = type=http-response, pattern=^https?:\/\/cn-acs\.m\.cainiao\.com\/gw\/mtop\.cainiao\., script-path=https://raw.githubusercontent.com/gblw1218/shadowrocket/refs/heads/main/script/ads_clean.js, requires-body=true, max-size=524288
[MITM]
hostname =  %APPEND% www.google.cn, google.cn,*.amap.com, interface.music.163.com, *.kugou.com,cn-acs.m.cainiao.com, mp.weixin.qq.com, wxs.qq.com